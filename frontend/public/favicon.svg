            <stop stop-color="#6366F1" />
            <stop offset="1" stop-color="#3B82F6" />
        </linearGradient>
        <linearGradient id="gradient-secondary" x1="35" y1="30" x2="65" y2="55" gradientUnits="userSpaceOnUse">
